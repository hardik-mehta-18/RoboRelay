services:
  ros-agent:
    build: .
    network_mode: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: "0"
      AGENT_ID: ${AGENT_ID:-rover-agent}
      PORT: 8780
    volumes:
      - agent-data:/opt/roborelay/data
    restart: unless-stopped
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:18884:1883"
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
volumes:
  agent-data:
  mqtt-data:
